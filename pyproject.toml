[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mls-lite-runner"
version = "0.4.2"
description = "Direct-model mini-SWE Agent and resumable orchestration for MLS-Bench Lite"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
mls-lite = "mls_lite_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
